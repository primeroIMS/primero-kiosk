definitions:
  steps:
    - step: &server-test
        name: Server tests
        image: ruby:3.4.7-bookworm
        script:
          - ./bin/run_server_tests.sh
        services:
          - postgres
        caches:
          - bundler
    - step: &client-test
        name: Client tests
        image: node:22.15.1
        size: 2x
        script:
          - printf '{}' > app/frontend/translations.json
          - npm install --global corepack@latest
          - corepack enable
          - corepack prepare pnpm@latest-10 --activate
          - pnpm install
          - pnpm run lint:run
          - pnpm run test -- --run --maxWorkers=2
        caches:
          - node
          - pnpm
    - step: &push-branch
        name: Build and Push to ACR
        image: atlassian/default-image:4
        clone:
          depth: full
        script:
          - git push https://$azdotoken@unicef.visualstudio.com/ICTD%20-%20Primero%20X%20DEV/_git/primero $BITBUCKET_BRANCH
          - git push https://$primeroimstoken@github.com/primeroIMS/primero.git $BITBUCKET_BRANCH
    - step: &build-and-push-to-acr
        image: atlassian/default-image:4
        services:
          - docker
        caches:
          - docker
        clone:
          depth: full
        script:
          - set -e
          - ls -la
          - cd docker
          - ls -la
          - docker/build.sh all
          - |
              if [ -n "$BITBUCKET_TAG" ]; then
                RAW_TAG="$BITBUCKET_TAG"
              else
                RAW_TAG="$BITBUCKET_BRANCH"
              fi

              # Docker-safe tag
              IMAGE_TAG=$(echo "$RAW_TAG" \
                | tr '[:upper:]' '[:lower:]' \
                | sed 's#[^a-z0-9._-]#-#g')

              echo "Using image tag: $IMAGE_TAG"
              export IMAGE_TAG
          - docker login -u "$AZ_ACR_USER" -p "$AZ_ACR_PASSWORD" "$AZ_ACR_NAME.azurecr.io"
          - docker push "$AZ_ACR_NAME.azurecr.io/application:$IMAGE_TAG"
          - docker push "$AZ_ACR_NAME.azurecr.io/worker:$IMAGE_TAG"
  services:
    postgres:
      image: postgres:15.6
      variables:
        POSTGRES_DB: 'primero_test'
        POSTGRES_USER: 'postgres'
        POSTGRES_PASSWORD: 'postgrespassword'
  caches:
    bundler: ./vendor
    pnpm: $BITBUCKET_CLONE_DIR/.pnpm-store
pipelines:
  branches:
    maint_*:
      - step: *push-branch
    '{develop*,release-*}':
      - parallel:
        - step: *server-test
        - step: *client-test
      # - step: *push-branch
    main:
      # - parallel:
        # - step: *server-test
        # - step: *client-test
      - step: *build-and-push-to-acr
  tags:
    v*:
      - step: *build-and-push-to-acr

  pull-requests:
    '**':
      - parallel:
        - step: *server-test
        - step: *client-test
