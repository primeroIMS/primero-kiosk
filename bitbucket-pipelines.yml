definitions:
  steps:
    - step: &server-test
        name: Server tests
        image: ruby:3.4.7-bookworm
        script:
          - ./bin/run_server_tests.sh
        services:
          - postgres
        caches:
          - bundler
    - step: &client-test
        name: Client tests
        image: node:22.15.1
        size: 2x
        script:
          - printf '{}' > app/frontend/translations.json
          - npm install --global corepack@latest
          - corepack enable
          - corepack prepare pnpm@latest-10 --activate
          - pnpm install
          - pnpm run lint:run
          - pnpm run test -- --run --maxWorkers=2
        caches:
          - node
          - pnpm
    - step: &push-branch
        name: Sync repo with Azure and GitHub
        image: atlassian/default-image:4
        clone:
          depth: full
        script:
          - git push https://$azdotoken@unicef.visualstudio.com/ICTD%20-%20Primero%20X%20DEV/_git/primero-kiosk $BITBUCKET_BRANCH
          # - git push https://$primeroimstoken@github.com/primeroIMS/primero.git $BITBUCKET_BRANCH
    - step: &build-and-push-to-acr
        name: Build and Push to ACR
        image: mcr.microsoft.com/azure-cli:2.57.0
        services:
          - docker
        caches:
          - docker
        clone:
          depth: full
        script:
          - |
            set -euo pipefail

            SHORT_COMMIT_ID="$(echo "$BITBUCKET_COMMIT" | tail -c 10)"
            if [ -n "${BITBUCKET_TAG:-}" ]; then
              RAW_TAG="$BITBUCKET_TAG"
            else
              RAW_TAG="$BITBUCKET_BRANCH-$SHORT_COMMIT_ID"
            fi

            # Docker-safe tag
            IMAGE_TAG=$(echo "$RAW_TAG" \
              | tr '[:upper:]' '[:lower:]' \
              | sed 's#[^a-z0-9._-]#-#g')

            echo "Using image tag: $IMAGE_TAG"
            export IMAGE_TAG
          - >-
            az login --service-principal
            --username="$AZURE_CLIENT_ID"
            --password="$AZURE_CLIENT_SECRET"
            --tenant="$AZURE_TENANT_ID"
          - az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          - |
            set -euo pipefail

            for SERVICE in application worker; do
              echo "Building Docker image for service: $SERVICE"

              BUILD_ARGS=(
                --build-arg APP_ROOT=/srv/kiosk
                --build-arg RAILS_LOG_PATH=/srv/kiosk/log/primero
                --build-arg APP_UID=1000
                --build-arg APP_GID=1000
              )

              if [[ "$SERVICE" == "worker" ]]; then
                BUILD_ARGS+=(--build-arg IS_WORKER=true)
              fi

              az acr build \
                --registry "${ACR_NAME}" \
                --platform linux/amd64 \
                --image "primero-kiosk/${SERVICE}:${IMAGE_TAG}" \
                --image "primero-kiosk/${SERVICE}:latest" \
                --file "./docker/application/Dockerfile" \
                "${BUILD_ARGS[@]}" \
                ./
            done
  services:
    postgres:
      image: postgres:15.6
      variables:
        POSTGRES_DB: "primero_test"
        POSTGRES_USER: "postgres"
        POSTGRES_PASSWORD: "postgrespassword"
  caches:
    bundler: ./vendor
    pnpm: $BITBUCKET_CLONE_DIR/.pnpm-store
pipelines:
  branches:
    "{develop*,release-*,main,r2-3611*}":
      # - parallel:
      #     - step: *server-test
      #     - step: *client-test
      - step: *push-branch
      - step: *build-and-push-to-acr
  tags:
    v*:
      - step:
          image: atlassian/default-image:4
          script:
            - git push https://$azdotoken@unicef.visualstudio.com/ICTD%20-%20Primero%20X%20DEV/_git/primero $BITBUCKET_TAG
            - git push https://$primeroimstoken@github.com/primeroIMS/primero.git $BITBUCKET_TAG
      - step: *build-and-push-to-acr

  pull-requests:
    "**":
      - parallel:
          - step: *server-test
          - step: *client-test
